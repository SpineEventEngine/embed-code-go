name: Run Tests

on: pull_request

jobs:
  build:
    # Prevents the workflow from running on non-human triggers.
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...

      - name: Run Tests
        # Tests must be run sequentially because they create temporary files that can cause issues.
        # Therefore, the "-p 1" argument is required.
        run: go test -v ./... -p 1

      - name: Run E2E Tests
        run: |
          go test -v -tags showcase ./showcase -p 1
          go run ./main.go -mode=check -config-path=showcase/embedding/embed-code.yml
          go run ./main.go -mode=check -config-path=showcase/configuration/single-source.yml
          go run ./main.go -mode=check -config-path=showcase/configuration/named-sources.yml
          go run ./main.go -mode=check -config-path=showcase/configuration/include-exclude.yml
          go run ./main.go -mode=check -config-path=showcase/configuration/multiple-embeddings.yml
