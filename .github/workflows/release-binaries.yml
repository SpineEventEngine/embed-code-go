# Releases binaries when application version changes.
name: Release Binaries

on:
  push:
    branches: [ master ]

permissions:
  contents: write

# Keep only the newest release run for the same ref. This avoids competing
# release attempts when several pushes land close together.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:

  release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Use the same Go version as the project, declared in go.mod.
      - name: Set Up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # Reads the app version from the `VERSION` file.
      # It must be a plain MAJOR.MINOR.PATCH value, such as 1.2.3.
      - name: Read Version
        id: version
        shell: bash
        run: |
          version="$(< VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format, found: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Compares the release version with current app version.
      # If current app version already exist in release, emits a warning, but flow counts as passed.
      - name: Check Release Version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::warning title=Release already exists::Release $RELEASE_TAG already exists. Bump VERSION to publish a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Build binaries only for new releases.
      - name: Build Binaries
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/embed-code-windows.exe main.go
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/embed-code-linux main.go
          GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/embed-code-macos main.go
          chmod +x dist/embed-code-linux dist/embed-code-macos

      # Sign the macOS binary with a Developer ID certificate stored in GitHub
      # secrets. The certificate must be exported as a base64-encoded .p12 file.
      - name: Sign macOS Binary
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          missing=()
          [[ -n "$MACOS_CERTIFICATE_P12_BASE64" ]] || missing+=("MACOS_CERTIFICATE_P12_BASE64")
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "$MACOS_CODESIGN_IDENTITY" ]] || missing+=("MACOS_CODESIGN_IDENTITY")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/embed-code-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/embed-code-signing-certificate.p12"
          keychain_password="$(uuidgen)"

          # GNU base64 supports --decode; macOS base64 uses -D.
          if printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null; then
            :
          else
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          curl -fsSL https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            -o "$RUNNER_TEMP/AppleRootCA-G3.cer"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
            -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security import "$RUNNER_TEMP/AppleRootCA-G3.cer" -k "$keychain_path"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$keychain_path"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            dist/embed-code-macos
          codesign --verify --verbose=4 dist/embed-code-macos

      # Notarize the macOS ZIP that will be published as the release asset.
      - name: Notarize macOS Binary
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          pushd dist
          ditto -c -k --keepParent embed-code-macos embed-code-macos.zip
          popd

          xcrun notarytool submit dist/embed-code-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          rm dist/embed-code-macos

      # Create the release for the current commit and attach all generated binaries.
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_notes="$(printf 'Embed Code %s\n\nThis release contains pre-built Embed Code binaries for macOS, Linux, and Windows.' "$RELEASE_TAG")"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "embed-code $RELEASE_TAG" \
            --notes "$release_notes"
